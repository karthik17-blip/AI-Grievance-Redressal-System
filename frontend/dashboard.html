<!DOCTYPE html>
<html>
<head>
<title>Complaint Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-10">

<h1 class="text-3xl font-bold mb-6">Admin Complaint Dashboard</h1>

<table class="table-auto w-full bg-white shadow rounded">
<thead class="bg-gray-200">
<tr>
<th class="p-2">ID</th>
<th class="p-2">Complaint</th>
<th class="p-2">Category</th>
<th class="p-2">Urgency</th>
<th class="p-2">Department</th>
<th class="p-2">Similarity</th>
</tr>
</thead>

<tbody id="complaintsTable"></tbody>
</table>

<script>
if(localStorage.getItem("admin_token") !== "admin-token"){
    window.location.href="login.html"
}
async function loadComplaints(){

const response = await fetch("http://52.90.55.70:8000/complaints")

const data = await response.json()

const table = document.getElementById("complaintsTable")

data.forEach(c => {

const row = `
<tr class="border-b">
<td class="p-2">${c.id}</td>
<td class="p-2">${c.text}</td>
<td class="p-2">${c.category}</td>
<td class="p-2">${c.urgency}</td>
<td class="p-2">${c.department}</td>
<td class="p-2">${c.similarity_score}</td>
</tr>
`

table.innerHTML += row

})

}

loadComplaints()

</script>

</body>
</html>
